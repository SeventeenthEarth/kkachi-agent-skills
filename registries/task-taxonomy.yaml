version: 0.1.0
purpose: "AI-neutral task taxonomy used before backend prompt rendering."

activation_scope:
  default_mode: direct_commander_response
  rule: "Do not classify every Hermes interaction. Apply task_class only after KHS/Kkachi project-execution mode is active."
  kas_mode_required_when:
    - explicit_khs_kkachi_kab_kah_run_request
    - master_applies_khs_to_project_directory
    - durable_repo_artifact_change_needs_run_evidence
    - backend_execution_plan_lifecycle_or_bridge_evidence_is_claimed
    - phase_gate_review_or_long_lived_team_collaboration_is_required
  kas_mode_not_required_when:
    - ordinary_explanation_or_design_chat
    - quick_status_check_or_single_command_report_without_durable_change
    - simple_direct_hermes_edit_outside_khs
    - non_project_chat
  project_directory_scope: "Project-local policy applies to the selected Kkachi project directory and its governed artifacts; it is not a global personality or all-chat constraint."

teal_applicability_fields:
  contract_version: design002.v1
  derivation: "teal_required = project_has_teal_lane && ui_ux_change"
  fields:
    - project_has_teal_lane
    - ui_ux_change
    - teal_required
    - teal_skip_reason
    - teal_waiver_approved
    - teal_waiver_approval_ref
    - teal_waiver_scope
    - teal_waiver_expires_at
  kkachi_source_default:
    project_has_teal_lane: false
    ui_ux_change: false
    teal_required: false
    teal_skip_reason: "No UI/UX surface in this project/task."
  required_when_teal_required:
    - DESIGN_PLAN_GATE
    - DESIGN_FIDELITY_REVIEW
  missing_required_status: required_teal_verdict_missing
  no_substitution_rule: "Ordinary Red/Orange/Gray/Blue color review, MAR, backend evidence, and temporary helpers are never substitutes for required Teal verdicts."

vocabulary_aliases:
  simple_report:
    registry_class: simple_command_report
    rule: "SOT `simple_report` maps to registry `simple_command_report`; keep it bounded to command/status evidence and final_report only unless the task is reclassified."
  investigation:
    registry_class: research_evidence
    rule: "SOT `investigation` maps to registry `research_evidence`; keep it read-only and artifact-backed unless the task is reclassified."
  review:
    registry_class: collaboration_review
    rule: "SOT `review` maps to registry `collaboration_review`; keep it read-only unless accepted feedback is separately authorized for mutation."
  docs_only:
    registry_class: docs_only
    rule: "SOT and registry `docs_only` are the same durable docs class; require docs validation and explicit skipped-phase reasons."

task_classes:
  development:
    description: "Code, test, build, architecture, or process-contract change that can affect executable behavior or future execution policy."
    default_work_path: A_development_execution
    default_work_mode: standard
    default_execution_mode: production_write
    default_spine: development_full
    kab_default: required_when_backend_execution_plan_lifecycle_or_bridge_evidence_is_claimed
    codegraph_default: required
    required_phases:
      - task_contract
      - phase_plan
      - codegraph_refresh
      - plan
      - ask
      - implement
      - enhance_test
      - optimize
      - update_docs
      - request_feedback
      - handle_feedback
      - final_verify
  research_evidence:
    description: "Read-only investigation, evidence gathering, option comparison, log/source inspection, or current-state report."
    default_work_path: B_discovery_shaping
    default_work_mode: light
    default_execution_mode: research
    default_spine: research_evidence_light
    kab_default: optional_when_backend_or_bridge_identity_is_needed
    codegraph_default: optional_when_code_context_is_material
    required_phases:
      - task_contract
      - evidence_collection
      - source_citation
      - final_verify
    skipped_by_default:
      - implement
      - enhance_test
      - optimize
      - request_feedback_broad_review_loop_unless_required_by_durable_artifact_change
  docs_only:
    description: "Durable documentation authoring, spec/SOT shaping, roadmap shaping, or synchronization that does not change executable behavior or execution policy."
    default_work_path: B_discovery_shaping
    default_work_mode: light
    default_execution_mode: docs_only
    default_spine: docs_only_light
    kab_default: optional_unless_backend_execution_or_independent_review_transport_is_required
    codegraph_default: conditional_when_docs_change_architecture_process_or_code_contract
    required_phases:
      - task_contract
      - plan
      - update_docs
      - docs_validation
      - final_verify
    skipped_by_default:
      - implement
      - enhance_test
      - optimize
      - broad_review_loop_unless_project_policy_or_durable_change_requires_review
  simple_command_report:
    description: "Bounded command execution or status check with no durable project change."
    default_work_path: B_discovery_shaping
    default_work_mode: light
    default_execution_mode: verification
    default_spine: direct_report
    kah_default: not_required_unless_master_explicitly_keeps_it_inside_khs
    kab_default: not_required
    codegraph_default: not_required
    required_phases:
      - command_evidence
      - final_report
    skipped_by_default:
      - plan
      - implement
      - enhance_test
      - optimize
      - broad_review_loop
  bootstrap_config:
    description: "Repository, KAH project, profile, manifest, tooling, or local test-bed setup/configuration."
    default_work_path: A_development_execution
    default_work_mode: standard
    default_execution_mode: readiness_hardening
    default_spine: bootstrap_config
    kab_default: optional_unless_backend_execution_or_bridge_evidence_is_claimed
    codegraph_default: conditional_when_source_context_or_policy_changes
    required_phases:
      - task_contract
      - preflight
      - configure
      - verification
      - final_verify
  collaboration_review:
    description: "Durable review, risk triage, team-member feedback routing, or decision capture without direct implementation."
    default_work_path: B_discovery_shaping
    default_work_mode: light
    default_execution_mode: verification
    default_spine: review_light
    kanban_default: required_for_long_lived_team_member_collaboration
    kab_default: optional_when_automated_review_by_different_tool_transport_is_evidenced
    codegraph_default: optional_when_review_depends_on_current_code_context
    required_phases:
      - task_contract
      - review_request
      - feedback_evidence
      - final_verify

task_types:
  implementation:
    description: "Change production code or tests to satisfy an existing SOT-backed task."
    default_path: A_development_execution
    default_execution_mode: production_write
  review:
    description: "Read-only review, feedback triage, or risk analysis."
    default_execution_mode: verification
  planning:
    description: "Create or refine implementation plan, acceptance criteria, and task breakdown."
    default_execution_mode: docs_only
  shaping:
    description: "Create or update SOT, roadmap trace, acceptance criteria, and handoff before implementation. Usually maps to `docs_only + Path B` after KHS mode is active."
    default_path: B_discovery_shaping
    default_execution_mode: docs_only
  spec_roadmap_shaping:
    description: "State investigation plus spec, SOT, acceptance criteria, roadmap, epic, or handoff updates before implementation. Use `research_evidence` for the read-only investigation stage, then `docs_only + Path B` for durable spec/roadmap edits."
    default_path: B_discovery_shaping
    default_execution_mode: docs_only
  enhance_test:
    description: "Add targeted regression coverage or test strategy."
    default_path: A_development_execution
  optimize:
    description: "Bounded cleanup/refactor after behavior is understood and protected."
    default_path: A_development_execution
  docs_update:
    description: "Durable documentation synchronization."
    default_execution_mode: docs_only
  adapter_qa:
    description: "Bridge/backend readiness, compatibility, or adapter validation work."
    default_execution_mode: adapter_qa

task_contract_fields:
  required:
    - task_id
    - project
    - task_class
    - work_path
    - phase
    - desired_state
    - acceptance_criteria
    - constraints
    - non_goals
    - context_sources
    - required_capabilities
    - teal_applicability
    - verification
  optional:
    - user_backend_preference
    - risk_notes
    - project_overlay
    - related_artifacts
    - task_classification_reason
    - skipped_phase_reasons

gating_rules:
  - "Classify before selecting phases; missing or ambiguous task class fails closed into clarification or a bounded task-contract blocker."
  - "Do not apply the full development spine to `simple_report`/`simple_command_report`, `investigation`/`research_evidence`, or `docs_only` unless the task is explicitly reclassified to `development` with a reason."
  - "Simple report/status paths use command_evidence plus final_report only when kept inside KHS; they do not inherit implementation, enhance_test, optimize, or broad review loops."
  - "Investigation/research evidence paths remain read-only and write compact findings to artifacts; they do not inherit implementation, enhance_test, optimize, or broad review loops unless evidence changes the classification."
  - "Docs-only paths update durable docs and run docs validation; implementation, enhance_test, and optimize stay skipped with explicit reasons unless executable behavior or execution policy changes."
  - "Collaboration review/review paths stay read-only unless accepted feedback is authorized for mutation and the task contract records the new class or phase."
