registry_version: 0.1.0
kind: kas_graph_template_registry
status: implemented
owner:
  team: blue
  role: hwangchung
authority:
  sot: docs/sot/graph-template-registry.md
  graph_integration_sot: docs/sot/workflow-graph-integration.md
  phase_policy_sot: docs/sot/phase-orchestration-policy.md
schema:
  id_pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
  template_path_pattern: "^templates/workflow-graphs/[a-z][a-z0-9]*(?:-[a-z0-9]+)*\\.yaml$"
  version_pattern: "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
  allowed_statuses:
    - candidate
    - implemented
    - deprecated
    - unsupported
  allowed_phase_applicability:
    - required
    - conditional
    - optional
    - not_applicable
  allowed_edge_types:
    - sequence
    - conditional
    - feedback_loop
  required_template_fields:
    - id
    - path
    - version
    - status
    - owner
    - summary
    - compatibility
    - phases
    - edges
    - gates
    - approvals
    - feedback_intake
    - validation_expectations
    - evidence_contract
kah_validation_expectations:
  capability_check_required: true
  required_commands:
    - kkachi-agent-helper graph init --from-template
    - kkachi-agent-helper graph validate
    - kkachi-agent-helper graph explain
    - kkachi-agent-helper graph diff
    - kkachi-agent-helper graph propose
    - kkachi-agent-helper graph apply
    - kkachi-agent-helper graph export
  direct_yaml_fallback_allowed: false
  kah_graph_alias_authoritative: false
feedback_intake_policy:
  policy_key: EXTERNAL_FEEDBACK_INTAKE
  min_rounds: 1
  max_rounds: 5
  round_1_required: true
  optional_continuation_rounds:
    - 2
    - 3
    - 4
    - 5
  five_rounds_mandatory: false
templates:
  - id: kas-default
    path: templates/workflow-graphs/kas-default.yaml
    version: 0.1.0
    status: implemented
    owner:
      team: blue
      role: hwangchung
      reviewers:
        - hahuyeon
        - yeomong
        - jingung
    summary: Default KAS development workflow graph template for capability-checked KAH graph initialization; custom project workflows remain supportable.
    compatibility:
      kah_min_version: 0.1.4
      required_capabilities:
        - kkachi-agent-helper graph init --from-template
        - kkachi-agent-helper graph validate
        - kkachi-agent-helper graph explain
        - kkachi-agent-helper graph diff
        - kkachi-agent-helper graph propose
        - kkachi-agent-helper graph apply
        - kkachi-agent-helper graph export
        - workflow_graph_configurable_feedback_intake
      phase_id_translation:
        policy: "POLPR-008 closeout: graph phase ids are the canonical kas-default graph ids, while older phase-contract/skill activity aliases remain translation-only compatibility names as explicit compatibility translations, not pending phase-renaming work or fallback authority."
        aliases:
          docs: update_docs
          final: final_verify
        required_scope: "Required phases are required in the default/base kas-default template path; run-local phase-plan applicability may still be skipped or not_applicable with concrete KAH policy reasons."
    phases:
      - id: intake
        applicability: required
        owner_role: hwangchung
        evidence_artifact: intake-classification.md
      - id: sot
        applicability: required
        owner_role: hwangchung
        evidence_artifact: sot-basis.md
      - id: roadmap
        applicability: required
        owner_role: hwangchung
        evidence_artifact: roadmap-update.md
      - id: task-classification
        applicability: required
        owner_role: hwangchung
        evidence_artifact: intake-classification.md
      - id: plan
        applicability: required
        owner_role: planner_backend
        evidence_artifact: plan.md
      - id: vet
        applicability: required
        owner_role: hwangchung
        evidence_artifact: review.md
      - id: ask
        applicability: required
        owner_role: planner_backend_plus_hwangchung
        evidence_artifact: prompt.md
      - id: implement
        applicability: required
        owner_role: implementer_backend
        evidence_artifact: impl-log.md
      - id: enhance-test
        applicability: required
        owner_role: implementer_backend
        evidence_artifact: enhance-test.md
      - id: ai-slop-cleaner
        applicability: required
        owner_role: implementer_backend
        evidence_artifact: ai-slop-cleaner.md
      - id: optimize
        applicability: required
        owner_role: implementer_backend
        evidence_artifact: improvement-note.md
      - id: docs
        applicability: required
        owner_role: hwangchung
        evidence_artifact: docs-update.md
      - id: verify
        applicability: required
        owner_role: hwangchung
        evidence_artifact: verification.md
      - id: review
        applicability: required
        owner_role: color_reviewers
        evidence_artifact: review.md
      - id: request-feedback-1
        applicability: required
        owner_role: feedback_backend
        evidence_artifact: feedback-request.md
      - id: handle-feedback-1
        applicability: required
        owner_role: implementer_backend
        evidence_artifact: handle-feedback-1.md
      - id: mar-review
        applicability: required
        owner_role: mar_reviewers
        evidence_artifact: mar-review.md
      - id: second-color-review
        applicability: required
        owner_role: color_reviewers
        evidence_artifact: second-color-review.md
      - id: final
        applicability: required
        owner_role: hwangchung
        evidence_artifact: final-report.md
    edges:
      - from: intake
        to: sot
        type: sequence
      - from: sot
        to: roadmap
        type: sequence
      - from: roadmap
        to: task-classification
        type: sequence
      - from: task-classification
        to: plan
        type: sequence
      - from: plan
        to: vet
        type: sequence
      - from: vet
        to: ask
        type: sequence
      - from: ask
        to: implement
        type: sequence
      - from: implement
        to: enhance-test
        type: sequence
      - from: enhance-test
        to: ai-slop-cleaner
        type: sequence
      - from: ai-slop-cleaner
        to: optimize
        type: sequence
      - from: optimize
        to: docs
        type: sequence
      - from: docs
        to: verify
        type: sequence
      - from: verify
        to: review
        type: sequence
      - from: review
        to: request-feedback-1
        type: sequence
      - from: request-feedback-1
        to: handle-feedback-1
        type: sequence
      - from: handle-feedback-1
        to: mar-review
        type: sequence
      - from: mar-review
        to: second-color-review
        type: sequence
      - from: second-color-review
        to: final
        type: sequence
    gates:
      - id: final-gate
        scope: final
        blocking: true
        evidence_required:
          - intake-classification.md
          - sot-basis.md
          - roadmap-update.md
          - plan.md
          - enhance-test.md
          - ai-slop-cleaner.md
          - impl-log.md
          - review.md
          - mar-review.md
          - second-color-review.md
          - verification.md
          - docs-update.md
          - final-report.md
        authority: hwangchung
      - id: graph-validation-gate
        scope: template
        blocking: true
        evidence_required:
          - kah_graph_init_json
          - kah_graph_validate_json
          - kah_graph_explain_json
          - graph_checksum
        authority: kah
    approvals:
      - authority: hwangchung
        trigger: graph_template_selection_or_registry_update
        evidence_required:
          - roadmap_task_id
          - registry_entry_id
          - KAH graph capability evidence
      - authority: hahuyeon
        trigger: safety_or_fail_closed_review
        evidence_required:
          - review verdict
          - blocking findings disposition
    feedback_intake:
      policy_key: EXTERNAL_FEEDBACK_INTAKE
      min_rounds: 1
      max_rounds: 5
      round_1_required: true
      optional_continuation_rounds:
        - 2
        - 3
        - 4
        - 5
      five_rounds_mandatory: false
    validation_expectations:
      graph_init_command: kkachi-agent-helper graph init --from-template templates/workflow-graphs/kas-default.yaml --json
      graph_validate_command: kkachi-agent-helper graph validate --json
      graph_explain_command: kkachi-agent-helper graph explain --json
      direct_yaml_fallback_allowed: false
      init_profile_allowed: false
      kah_graph_alias_authoritative: false
      temp_repo_verification_required: true
      expected_phase_count: 19
      expected_edge_count: 18
      phase_path_note: Mirrors the active kas-default template MAR development spine with graph ids docs, verify, and final; older activity aliases such as update_docs and final_verify are translation-only compatibility names. Custom project workflows remain supportable and must not be replaced without proposal/apply approval evidence.
    evidence_contract:
      canonical_artifact: templates/run-artifacts/graph-evidence.md.tmpl
      run_artifact_path: graph-evidence.md
      report_section: kah_graph_evidence
      preserve:
        - registry_version
        - template_id
        - template_path
        - template_version
        - capability_check_evidence
        - validation_report_path
        - explain_report_path
        - semantic_diff_output_path
        - proposal_id
        - proposal_path
        - approval_evidence_ref
        - audit_evidence_path
        - graph_checksum
        - graph_version
        - kah_graph_audit_event_ids
        - conflict_fail_closed_reason
