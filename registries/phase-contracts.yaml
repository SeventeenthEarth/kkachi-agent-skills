version: 0.2.0
purpose: "Canonical KHS phase contracts. For workflow-managed runs, the selected KAH workflow instance plus transition ledger is the execution-order SOT; phase_plan records phase applicability/evidence and must project from KAH workflow state. KAH metadata remains deterministic helper classification and must not decide which KHS phases execute."

workflow_authority:
  sot: phase_plan_for_phase_applicability__kah_workflow_instance_for_workflow_managed_order
  workflow_managed_order_sot: kah_workflow_instance_and_transition_ledger
  phase_projection_required: true
  phase_projection_capability: workflow_phase_projection_validation
  kah_metadata_role: helper_classification
  kah_metadata_fields:
    - work_path
    - work_mode
    - execution_mode
    - urgency
    - sot_policy
  rule: "KHS decides phase applicability; when a classification-selected workflow is active, KAS must follow KAH ready/start/complete admission, required outputs, and KAH final projection verifies phase-plan/checklist evidence against workflow instance state."

canonical_spine:
  - plan
  - ask
  - implement
  - enhance_test
  - optimize
  - update_docs
  - request_feedback
  - handle_feedback
  - mar_review
  - second_color_review
  - final_verify
  - improve

role_model:
  hermes:
    responsibility:
      - manager_orchestrator
      - risk_approval_router
      - final_verifier
      - user_facing_korean_reporter
    default_code_author: false
    simple_direct_exception: "Only outside KHS, or when the master explicitly converts the work to a direct Hermes task."
  planner_backend:
    phases:
      - plan
      - ask
  implementer_backend:
    phases:
      - implement
      - enhance_test
      - optimize
      - update_docs
      - handle_feedback
  mar_reviewers:
    phases:
      - mar_review
    write_permission: read_only_review_only
  color_reviewers:
    phases:
      - second_color_review
    write_permission: read_only_review_only
  feedback_backend:
    phases:
      - request_feedback
    write_permission: read_only_by_default
  mapping_rule: "Logical roles may share one physical KAB backend/session or use separate backends according to project policy, user preference, Hermes judgment, and capability gates."

task_basis:
  user_selects_task_each_run: true
  no_auto_next_task_default: true
  expected_docs_surfaces:
    - roadmap
    - architecture
    - adr
    - specs
    - implementation_notes
    - todo

task_classification_policy:
  activation_boundary: "Classification is inside KHS/Kkachi project-execution mode only; default Hermes/direct commander conversation remains outside KHS unless activation triggers are met."
  classification_required_before_phase_selection: true
  source: registries/task-taxonomy.yaml
  classes:
    - development
    - research_evidence
    - docs_only
    - simple_command_report
    - bootstrap_config
    - collaboration_review
  aliases:
    simple_report: simple_command_report
    investigation: research_evidence
    review: collaboration_review
    docs_only: docs_only
  rules:
    - "Do not classify every chat turn; first decide whether KHS mode is active for this project/run."
    - "Do not apply the full development spine to read-only research, evidence collection, simple command/report, or pure docs tasks."
    - "Every skipped development phase must have an explicit reason in task-contract.yaml, phase-plan.yaml, checklist.md, and final report."
    - "Simple command/report tasks normally stay outside KHS unless the master explicitly keeps them inside a KHS/KAH run."
    - "Long-lived team-member collaboration uses Kanban evidence; temporary subagents and delegate_task do not count as team-member delegation, official color review, MAR role coverage, or project-Gray documentation/integrity review."
    - "State investigation that only reports current facts maps to research_evidence; changing spec/SOT/roadmap/handoff from that evidence maps to docs_only + Path B unless it also changes executable behavior or execution policy."
    - "If a docs-only task changes architecture, process policy, contracts, roadmap status, or examples that tests validate, require docs validation and consider CodeGraph refresh."
    - "SOT aliases are accepted only through the explicit mapping simple_report/simple_command_report, investigation/research_evidence, review/collaboration_review, and docs_only/docs_only."
    - "Simple report/status, investigation/research evidence, and docs-only paths must not inherit implementation, enhance_test, optimize, or broad review loops unless the task contract records a classification change and reason."
  default_spines:
    development_full:
      phases: [codegraph_refresh, plan, ask, implement, enhance_test, optimize, update_docs, request_feedback, handle_feedback, mar_review, second_color_review, final_verify, improve]
    research_evidence_light:
      phases: [task_contract, evidence_collection, source_citation, final_verify]
    docs_only_light:
      phases: [task_contract, plan, update_docs, docs_validation, final_verify]
    direct_report:
      phases: [command_evidence, final_report]
    bootstrap_config:
      phases: [task_contract, preflight, configure, verification, final_verify]
    review_light:
      phases: [task_contract, review_request, feedback_evidence, final_verify]

output_policy:
  language: english_product_and_backend_output
  compact_console_schema:
    - "Status: <pass|fail|blocked|in_progress|not_applicable>"
    - "Summary: <1-5 bullets>"
    - "Files: <changed/inspected paths only>"
    - "Verification: <commands/checks and short result>"
    - "Risks/blockers: <only actionable remaining issues>"
    - "Detailed artifact: <path or not_applicable reason>"
    - "Next action requested: <approval/review/none>"
  artifact_first_detail_path: ".kkachi/runs/<run_id>/artifacts/<phase>/backend-<phase>.md"
  fail_closed_rule: "If a backend cannot write the detailed artifact, report Status: blocked with the artifact-write blocker and do not dump long plans, logs, diffs, files, reviews, or checklists into chat."
  applies_to:
    - direct_codex_app_server
    - kab_mediated_backend_lanes

evidence_summary_contract:
  phase_packet_template: "templates/run-artifacts/phase-packet.yaml.tmpl"
  run_summary_template: "templates/run-artifacts/run-summary.yaml.tmpl"
  phase_packet_path: ".kkachi/runs/<run_id>/phase-packets/<phase>.yaml"
  run_summary_path: ".kkachi/runs/<run_id>/run-summary.yaml"
  purpose: "read-summary-first reversible continuity indexes; not replacements for source artifacts."
  required_pointer_rule: "Packets and summaries preserve artifact paths, checksums, retrieval instructions, and invalidation behavior before they are used for decisions."
  required_packet_fields:
    - summary_id
    - run_id
    - task_id
    - phase_id
    - status
    - packet_validity
    - source_artifact.path
    - source_artifact.checksum
    - evidence_class
    - compression_policy
    - changed_paths
    - verification_summary
    - blocker_list
    - critical_references
    - retrieval_instructions
    - invalidation_behavior
    - next_action
  required_run_summary_fields:
    - summary_id
    - run_id
    - task_id
    - status
    - packet_validity
    - phase_packets.phase_id
    - phase_packets.packet_path
    - phase_packets.packet_checksum
    - changed_paths
    - verification_summary
    - blocker_list
    - critical_references
    - retrieval_instructions
    - invalidation_behavior
    - next_action
  compression_forbidden_classes:
    - acceptance_criteria
    - explicit_operator_approval_or_denial
    - forbidden_scope_or_non_goal
    - auth_token_provider_gateway_model_boundary
    - exact_failing_assertion_or_command_failure
    - blocking_review_finding
    - kah_final_gate_failure
    - checksum_or_evidence_path_required_for_reversibility
  compression_safe_classes:
    - successful_repetitive_logs
    - dependency_install_build_noise
    - broad_unchanged_inventory
    - repeated_status_readback
    - already_preserved_artifact_body
    - non_critical_progress_chatter
    - large_passing_command_output_with_log_path_checksum
  retrieval_order:
    - "Read run-summary.yaml first when current."
    - "Read the relevant phase-packets/<phase>.yaml next."
    - "Read targeted source artifact ranges when exact evidence is needed, checksums mismatch, status is fail/blocked, or packet_validity is stale/invalid/superseded."
  invalidation_behavior:
    invalid_if:
      - "referenced artifact or packet is missing"
      - "referenced checksum changes"
      - "phase or run status changes after packet/summary generation"
      - "acceptance criteria, forbidden scope, approval/denial, review finding, or gate verdict changes"
    on_invalid: "Do not rely on the compact summary; retrieve source artifacts and regenerate the packet/summary."
  boundary_rules:
    - "Full detail remains recoverable by direct artifact path and checksum; evidence discard is forbidden."
    - "No Hermes proxy, headroom dependency, or runtime context-pruning requirement."
    - "KAH may later validate mechanical fields only; no subjective summarization or compression-policy decision."
    - "KAB remains backend/session/control evidence only; no compression-policy decision or backend-selection mutation."
    - "No auth/token/provider/gateway/model mutation authorization."
    - "TOKEN-009 review bundle and TOKEN-010 changed-path matrix scope is owned by adjacent contracts, not by TOKEN-008 evidence summaries."

gjc_packet_contract:
  contract_version: "gajae003.v1"
  owner: KAS
  kah_validation_role: mechanical_validation_only
  purpose: "KAS-owned GJC delegation packet templates for GAJAE planning, implementation, review/fix, and callback candidate evidence."
  packet_templates:
    deep_interview: "templates/run-artifacts/gjc-deep-interview-packet.yaml.tmpl"
    ralplan: "templates/run-artifacts/gjc-ralplan-packet.yaml.tmpl"
    ultragoal: "templates/run-artifacts/gjc-ultragoal-packet.yaml.tmpl"
    review_fix_turn: "templates/run-artifacts/gjc-review-fix-turn-packet.yaml.tmpl"
    callback_contract: "templates/run-artifacts/gjc-callback-contract-packet.yaml.tmpl"
  required_fields:
    - schema_version
    - packet_kind
    - task_id
    - run_id
    - source_command.korean
    - gjc_operational_brief_english
    - authority_boundaries
    - stop_ask_gates
    - plan_lock
    - fallback_policy
    - no_gjc_self_approval
    - forbidden_scope
    - expected_outputs
    - artifact_ref_contract
    - completion_boundary
  fixed_values:
    fallback_policy: none_fail_closed
    no_gjc_self_approval: true
  reference_vocabulary:
    packet_ref: "KAS input packet evidence validated by KAH as a run-local path plus sha256."
    artifact_refs: "GJC candidate output evidence preserved by KAH as run-local paths plus sha256 hashes."
  boundary_rules:
    - "Korean source command remains the source of truth."
    - "GJC-facing operational content is English."
    - "GJC output is candidate evidence only."
    - "KAS/Blue/color/MAR/final gates remain acceptance authority."
    - "KAH validates packet_ref and artifact_refs mechanically only; it must not parse packet policy or decide acceptance."
    - "No KAB Stage 2/3 activation, live GJC/KAT/KAB invocation, profile/provider/auth/token/gateway/model mutation, install, release, push, hidden fallback, warning-only gate, or GJC self-approval."
    - "GAJAE-004 async ralplan/callback pilot is allowed only for ralplan_ready and callback evidence."
    - "GAJAE-005 KAT/ultragoal evidence and GAJAE-006 watcher/callback closeout remain factual source-side evidence unless separately approved for final completion, live runtime, or same-thread wake readiness."

review_bundle_contract:
  contract_version: "token009.v1"
  template: "templates/run-artifacts/review-bundle.yaml.tmpl"
  artifact_path: ".kkachi/runs/<run_id>/review-bundle.yaml"
  purpose: "Compact review fan-in pointer bundle for Blue synthesis; source review evidence remains recoverable by artifact path and checksum."
  mechanical_validation_only: true
  required_fields:
    - task_id
    - run_id
    - acceptance_reference
    - diff_artifact.path
    - diff_artifact.checksum
    - diff_checksum
    - changed_paths
    - verification_summaries
    - forbidden_scope
    - requested_verdict_vocabulary
    - role_verdicts
    - finding_dispositions
    - artifact_pointers
    - blue_synthesis_inputs
    - retrieval_instructions
    - invalidation_behavior
  requested_verdict_vocabulary:
    - accepted
    - accepted_with_required_rework
    - rejected
    - blocked
  allowed_scopes:
    - artifact existence
    - artifact checksum
    - role verdict presence
    - finding disposition presence
  allowed_scope_rule: "allowed scopes are mechanically checkable"
  retrieval_instructions:
    default: "Read review-bundle.yaml first, then retrieve targeted source review artifacts by path and checksum when exact evidence is needed."
    required_when:
      - "artifact existence cannot be confirmed"
      - "artifact checksum mismatches"
      - "role verdict presence is missing"
      - "finding disposition presence is missing"
  invalidation_behavior:
    invalid_if:
      - "referenced artifact is missing"
      - "referenced artifact checksum changes"
      - "requested verdict vocabulary changes"
      - "role verdict presence changes"
      - "finding disposition presence changes"
    on_invalid: "Do not rely on review-bundle.yaml; retrieve source artifacts and regenerate the bundle."
  boundary_rules:
    - "Full review evidence remains recoverable by artifact path and checksum; KAS must not discard review evidence to save tokens."
    - "No KAH subjective review judgment or review-quality decision."
    - "No KAB policy/runtime mutation."
    - "No auth/token/provider/gateway/model mutation."

fan_in_watcher_contract:
  contract_version: "token009.v1"
  purpose: "terminal-only role fan-in watcher for compact collection/notification only."
  terminal_only: true
  validation: mechanical
  mechanical_validation_only: true
  pending_behavior: "pending emits no output"
  terminal_behavior: "terminal emits compact report"
  notification_scope: "collection/notification only"
  pending_emit_output: false
  terminal_report:
    required_fields:
      - watcher_status
      - collected_roles
      - missing_roles
      - role_verdicts
      - finding_dispositions
      - artifact_pointers
      - allowed_scopes
    allowed_scopes:
      - artifact existence
      - artifact checksum
      - role verdict presence
      - finding disposition presence
    allowed_scope_rule: "allowed scopes are mechanically checkable"
  disallowed_behavior:
    - "No warning-only gate state."
    - "No KAH subjective review judgment or review-quality decision."
    - "No hidden fallback."
    - "No Discord/channel delivery completion claim."
    - "No evidence discard."
    - "No Hermes proxy/headroom requirement."
    - "No KAB policy/runtime mutation."
    - "No auth/token/provider/gateway/model mutation."

change_verification_matrix_contract:
  contract_version: "token010.v1"
  template: "templates/run-artifacts/change-verification-matrix.yaml.tmpl"
  artifact_path: ".kkachi/runs/<run_id>/change-verification-matrix.yaml"
  purpose: "KAS-owned changed-path verification-selection record for selected, scoped, skipped, and final aggregate verification evidence."
  policy_owner: KAS
  verification_selection_policy_owner: KAS
  kah_validation_role: mechanical_recorded_evidence_only
  kah_must_not:
    - decide skip policy
    - choose tests to skip
    - infer skips from file extensions
    - judge prose quality
    - create warning-only gates
  required_fields:
    - matrix_version
    - task_id
    - run_id
    - policy_owner
    - verification_selection_policy_owner
    - kah_validation_role
    - changed_path_source.source_type
    - changed_path_source.source_ref
    - changed_path_source.source_checksum
    - changed_paths.path
    - changed_paths.change_class
    - changed_paths.deterministic_evidence_refs.path
    - changed_paths.deterministic_evidence_refs.checksum
    - rules.selected_rule_id
    - rules.change_class
    - rules.changed_path_set_classes
    - rules.selected_verification_commands.selected_profile_id
    - rules.selected_verification_commands.selected_gate_id
    - rules.selected_verification_commands.command
    - rules.selected_verification_commands.timeout
    - rules.selected_verification_commands.applicability
    - rules.selected_verification_commands.status
    - rules.selected_verification_commands.evidence_ref.path
    - rules.selected_verification_commands.evidence_ref.checksum
    - rules.scoped_verification.command
    - rules.scoped_verification.scope_reason
    - rules.scoped_verification.status
    - rules.scoped_verification.evidence_ref.path
    - rules.scoped_verification.evidence_ref.checksum
    - rules.skipped_gates.selected_profile_id
    - rules.skipped_gates.selected_gate_id
    - rules.skipped_gates.skip_reason
    - rules.skipped_gates.deterministic_evidence_refs.path
    - rules.skipped_gates.deterministic_evidence_refs.checksum
    - rules.no_skipped_gates_reason
    - rules.final_aggregate_preservation.status
    - rules.final_aggregate_preservation.not_applicable_reason
    - rules.final_aggregate_preservation.deterministic_evidence_refs.path
    - rules.final_aggregate_preservation.deterministic_evidence_refs.checksum
  rule_change_class: "rules.change_class must be one allowed changed_paths.change_class value, or not_applicable only when changed_path_set_classes records every covered class; composite strings are invalid."
  no_skip_semantics: "skipped_gates: [] is valid only when no selected or aggregate gate was skipped and rules.no_skipped_gates_reason records that deterministic fact."
  change_classes:
    no-change:
      required_evidence:
        - empty_or_unchanged_path_evidence
        - prior_pass_evidence
        - unchanged_path_evidence
        - explicit_skip_reason
        - final_aggregate_preservation_status
    docs-only:
      required_evidence:
        - changed_docs_path_set
        - docs_or_scoped_verification_command_evidence
        - selected_rule_id
        - skipped_gate_reasons
        - explicit_final_aggregate_status
      rule: "File extension alone must not imply a skip."
    source-code:
      required_evidence:
        - changed_source_path_set
        - focused_unit_integration_e2e_or_task_specific_evidence
        - selected_verification_command_evidence
        - skipped_gate_reasons
        - final_aggregate_preservation_for_development_tasks
    template:
      required_evidence:
        - changed_template_path_set
        - template_consumer_or_docs_contract_verification_evidence
        - selected_verification_command_evidence
        - skipped_gate_reasons
        - final_aggregate_preservation_status
    schema:
      required_evidence:
        - changed_schema_or_registry_path_set
        - schema_or_registry_validation_evidence
        - dependent_docs_contract_evidence
        - selected_verification_command_evidence
        - skipped_gate_reasons
        - final_aggregate_preservation_status
    test-only:
      required_evidence:
        - changed_test_path_set
        - focused_changed_test_command_evidence
        - selected_verification_command_evidence
        - skipped_gate_reasons
        - explicit_aggregate_policy
      rule: "Test-only changes do not automatically make aggregate verification not_applicable."
    artifact-only:
      required_evidence:
        - changed_artifact_path_set
        - artifact_path_checksum_schema_evidence
        - selected_command_evidence_or_not_applicable_reason
        - skipped_gate_reasons
        - no_product_source_completion_claim
    review-comment-only:
      required_evidence:
        - changed_review_comment_or_disposition_artifact_evidence
        - role_and_finding_disposition_pointers
        - selected_command_evidence_or_not_applicable_reason
        - skipped_gate_reasons
        - no_replacement_for_implementation_kah_evidence_or_final_verification
  final_aggregate_preservation_rule: "Development tasks preserve final aggregate verification unless task contract or responsible approval explicitly marks it not_applicable with deterministic evidence."
  mechanical_validation_allowed_scopes:
    - required key presence
    - allowed change-class vocabulary
    - allowed status vocabulary
    - artifact existence
    - checksum shape and match
    - recorded approval/evidence references
  boundary_rules:
    - "KAS owns verification-selection policy."
    - "KAH validates recorded deterministic evidence only."
    - "KAH must not decide skip policy or choose tests to skip."
    - "No hidden fallback."
    - "No warning-only gates."
    - "No subjective KAH prose judgment."
    - "No evidence discard."
    - "No KAB/Hermes runtime or provider/auth/token/gateway/model/profile settings mutation."

codegraph_policy:
  first_task_completion_command: "codegraph init -i"
  new_task_start_command: "codegraph index"
  required_when:
    - code_change_run
    - docs_or_skill_change_that_changes_process_or_architecture
    - task_uses_codegraph_mcp_context
  evidence_rules:
    - "At the start of every new KHS task after CodeGraph exists, run `codegraph index <repo>` and preserve `codegraph status <repo>` evidence before backend planning."
    - "If the repository has no `.codegraph/` and the previous completed task made CodeGraph initialization due, run `codegraph init -i <repo>` and preserve the resulting status evidence."
    - "If CodeGraph is unavailable, record the missing command as a blocker or explicit degraded-evidence reason; do not silently skip code context refresh."

kab_usage_policy:
  kab_adoption_stage: required_in_project_backend_policy_or_run_artifact
  backend_execution: required_when_backend_or_bridge_evidence_needed
  automated_review_by_different_tool: kab_later_until_transport_evidenced
  plan_lifecycle: required_when_kab_plan_surface_is_used
  bridge_evidence: required_when_runtime_completion_or_backend_identity_is_claimed
  khs_code_change: required_when_kab_backed_or_backend_executed
  khs_dev_run: required_when_kab_backed_execution_plan_lifecycle_or_bridge_evidence_is_part_of_contract
  stage1_direct_codex_app_server_baseline: allowed_when_explicitly_authorized_and_no_kab_codex_runtime_claimed
  khs_docs_only: not_required_unless_backend_execution_or_kab_review_transport_needed
  kas_kah_local_exception: "Allowed for scoped KAS/KAH-local CLIMVP, GRAPHMVP, and docs-only maintenance when explicitly authorized and recorded; must not claim KAB runtime support."
  kab_later_required_for:
    - backend_execution
    - automated_review_by_different_tool
    - kab_plan_lifecycle
    - bridge_evidence

feedback_loop_policy:
  minimum_rounds: 1
  maximum_rounds: 5
  round_1_required: true
  additional_rounds: "Hermes decides when optional request-feedback/handle-feedback continuation rounds 2..5 are useful; additional rounds are not mandatory."
  no_actionable_feedback: "Still run handle-feedback and record 'no actionable feedback'."

mar_task_loop_policy:
  contract_version: "martl.v1"
  sot: docs/sot/mar-task-loop-contract.md
  required_for_task_classes:
    - development
  required_after:
    - handle_feedback
  required_before:
    - second_color_review
    - final_verify
  required_roles:
    - logic
    - security
    - arch
    - cve
    - test_adequacy
  required_artifacts:
    - mar-review.md
    - mar-merge-pack.md
    - mar-blue-disposition.md
  terminal_candidate_statuses:
    - PASS
    - PASS_WITH_FINDINGS
  non_terminal_statuses:
    - REQUEST_CHANGES
    - BLOCKED
    - DEGRADED
    - FAILED
  request_changes_rule: "REQUEST_CHANGES is non-terminal: Blue/Red disposition must route accepted findings to the selected implementer lane, affected verification must rerun, and refreshed MAR evidence plus post-MAR color review are required before final_verify."
  pass_with_findings_rule: "PASS_WITH_FINDINGS is terminal-candidate only after Blue disposition records every finding as fixed, non-blocking, rejected with rationale, or deferred with accepted risk; Red adjudication is required when triggered."
  boundary_rules:
    - "KAS owns reviewer/provider selection policy, merge pack, Blue disposition, requested-change routing, and loop closure semantics."
    - "KAH validates recorded deterministic evidence only and must not choose reviewers, adjudicate findings, mutate source, approve waivers, or convert degraded coverage to warning-only pass."
    - "Provider availability, prompt rendering, dispatch success, model wording, or model voting is not review completion authority."
    - "No automatic source mutation or retry-until-pass without Blue/Red disposition and verification."

implementation_approval_policy:
  low_risk_default: auto_approve_after_plan_and_ask
  user_notice_required_before_auto_start: true
  explicit_user_approval_required_when:
    - api_change
    - db_or_schema_or_migration_change
    - security_auth_or_secret_handling_change
    - dependency_change
    - architecture_change
    - sot_change
    - large_diff_or_broad_file_fanout
    - low_confidence
    - unresolved_ask_phase_ambiguity

paths:
  A_development_execution:
    description: "Existing SOT, roadmap trace, and acceptance basis exists before implementation."
    code_write_default: allowed_through_approved_lane; KAB required only for KAB-backed or backend-executed writes
    required_before_write:
      - sot_basis
      - roadmap_trace_or_not_applicable_reason
      - acceptance_criteria
      - task_contract
      - phase_plan
      - plan_md_captured_from_kab_when_kab_planner_is_used
      - checklist_md_normalized_by_khs
      - backend_selection_when_kab_lane_is_used
      - capability_check_when_kab_lane_is_used
      - prompt_md_when_kab_lane_is_used
      - codegraph_index_or_unavailable_reason
      - plan_fixed_with_required_red_approval_when_project_policy_requires_it
      - ask_phase_completed
  B_discovery_shaping:
    description: "SOT, roadmap trace, acceptance criteria, or implementation handoff is missing or weak."
    code_write_default: forbidden
    output_goal: "Durable SOT/roadmap/acceptance/handoff artifacts that can enter Path A."
    required_outputs:
      - problem_framing
      - sot_update_or_minimal_sot
      - roadmap_trace
      - acceptance_criteria
      - non_goals
      - implementation_handoff

phase_plan_contract:
  artifact: phase-plan.yaml
  ownership: khs_hermes
  status_values:
    - pending
    - in_progress
    - done
    - skipped
    - blocked
    - not_applicable
  applicability_values:
    - required
    - conditional
    - optional
    - not_applicable
  rules:
    - "Every canonical phase in the selected task spine must have a phase_plan entry; development-only phases outside the selected spine may be omitted or marked not_applicable with reasons."
    - "KAH work_path/work_mode/execution_mode may inform initial defaults but must not override task_classification or phase_plan applicability."
    - "Skipped or not_applicable entries require a reason."
    - "request_feedback_1 and handle_feedback_1 are required for every KHS run."
    - "request_feedback_2..5 and handle_feedback_2..5 are conditional continuation rounds and must not exceed round 5."
    - "Development runs require mar_review after feedback handling and before second_color_review/final_verify unless a recorded user waiver/replacement exists."
    - "MARTL REQUEST_CHANGES/BLOCKED/DEGRADED/FAILED statuses are non-terminal; accepted fixes require implementer-lane mutation, affected verification, refreshed MAR evidence, and post-MAR color review before final_verify."
    - "Code-change runs include optimize as conditional_recommended; skipping requires a reason."
    - "final_verify checks phase_plan and checklist.md before final report."

phases:
  plan:
    intent: "Define the path-appropriate plan before backend execution and create the mandatory run progress checklist."
    owner_role: planner_backend
    required_inputs:
      - task_contract
      - phase_plan
      - sot_basis
      - project_overlay
      - codegraph_status_or_degraded_reason_when_required
    expected_outputs:
      - plan.md
      - checklist.md
    kab_plan_capture_contract:
      when_kab_planner_lane_is_used: true
      source_commands:
        - "kkachi-agent-bridge plan read --session <session_id>"
        - "GET /api/plan/<session_id>"
      required_response_fields:
        - plan.plan_state
        - plan.plan_text
        - plan.plan_ref
        - plan.source_evidence
      prompt_requirements:
        - "Ask the planner backend to include a clearly delimited 'KHS Checklist Seed' section in plan.plan_text."
        - "The seed should use unchecked markdown tasks and include phase, evidence artifact, and verification/check condition."
        - "The seed is input for KHS normalization, not the final KAH checklist.md by itself."
      storage_rules:
        - "Copy plan.plan_text into plan.md before implementation starts."
        - "Preserve plan.plan_state, plan.plan_ref, and plan.source_evidence in plan.md and/or bridge-events.md."
        - "When project policy requires Red plan approval, keep implementation blocked until the Red verdict is ACCEPT or accepted feedback has been folded into a fixed plan."
      backend_timing:
        claude: "capture in plan_pending_approval before approve; approve starts implementation"
        glm: "capture in plan_pending_approval before approve; approve starts implementation"
        codex: "capture in plan_pending_approval before approve; approve starts implementation"
        gemini: "capture in plan_pending_approval or plan_approved_waiting_for_start; implementation starts only after start-approved"
        opencode: "capture in plan_pending_approval or plan_approved_waiting_for_start; fail closed on PLAN_AMBIGUOUS"
      safe_order:
        - plan_start
        - plan_read
        - save_plan_text_to_plan_md
        - derive_checklist_md_from_plan_and_phase_contract
        - approve_or_start_according_to_backend
    checklist_contract:
      owner: khs_hermes
      source_inputs:
        - plan.plan_text_from_kab
        - khs_checklist_seed_when_present
        - phase_contracts_yaml
        - task_contract
        - acceptance_criteria
        - expected_evidence_artifacts
      output_artifact: checklist.md
      note: "KAB may include task checkboxes inside plan.plan_text, especially for OpenCode, but KHS/Hermes owns the normalized KHS progress checklist stored in KAH."
      mandatory: true
      timing:
        create: "during plan, after plan.plan_text capture and before implementation approval/start"
        update: "after ask and after every later phase"
      required_rows:
        - every_canonical_phase
        - feedback_round_1
        - conditional_feedback_rounds_2_to_5
      required_fields:
        - phase
        - required_or_conditional
        - state
        - owner_role
        - backend_or_session
        - evidence_artifact
        - gate_or_check
        - notes_or_skip_reason
      state_values:
        - pending
        - in_progress
        - done
        - skipped
        - blocked
      rules:
        - "Skipped or not-applicable phases must keep a row with an explicit reason."
        - "Code-change runs include optimize by default; skipping optimize requires a reason."
        - "Code-change runs include CodeGraph refresh evidence and selected verification profile/gate evidence after implementation, test-enhancement, slop-cleanup, and optimization rows unless explicitly not applicable."
        - "Feedback must run at least once and at most five times; rounds 2..5 are optional continuation rounds only."
        - "Final verification must use checklist.md to prove every required phase has evidence."
    gate: plan_gate
  ask:
    intent: "Always ask after plan whether ambiguity, missing decisions, or user choices remain before implementation."
    owner_role: planner_backend_plus_hermes
    applicability: required
    expected_outputs:
      - ask.md
      - answered-decisions.md
      - updated_plan_or_phase_plan_when_decisions_change
    rules:
      - "Ask the planner backend to surface ambiguity or decision needs."
      - "Hermes answers from SOT/project context when safe."
      - "Ask the master only when Hermes cannot decide safely or user intent must be confirmed."
      - "If no open questions remain, record that explicitly instead of skipping the phase."
    gate: decision_gate
  implement:
    intent: "Reach the approved desired state in Path A, or produce handoff artifacts only in Path B."
    owner_role: implementer_backend
    required_inputs:
      - phase_plan
      - plan.md
      - checklist.md
      - selected-cli.json
      - prompt.md
      - ask_phase_completion
    approval_before_start:
      low_risk: "Hermes may approve/start automatically after notifying the master with intended direction."
      high_risk: "Require explicit master approval."
    expected_outputs:
      - diff.patch
      - impl-log.md
      - cli-output.md
      - verification_after_implementation_selected_profile_gate
    rules:
      - "After implementation changes, run the selected verification profile/gate command before marking implementation complete; record selected_profile_id, selected_gate_id, command, timeout, applicability, status, exit code, duration, log path, log checksum, bounded failure excerpt, and deterministic failure extractor posture."
    gate: implementation_gate
  enhance_test:
    intent: "Add or improve unit, integration, and e2e regression coverage where risk warrants it, then run the selected verification profile/gate command."
    owner_role: implementer_backend
    applicability: conditional
    skip_rule: "Allowed only when phase_plan and checklist.md record why no test enhancement is useful."
    expected_outputs:
      - test-plan.md
      - test-log.md
      - verification_after_test_enhancement_selected_profile_gate
    rules:
      - "Assess unit, integration, and e2e coverage separately for the changed behavior."
      - "Integration tests should use mocks/fakes/stubs instead of production external resources."
      - "E2E tests must use isolated test environments and must not affect live Hermes, Discord, gateway, auth, or production user state."
      - "Run the selected verification profile/gate command after test enhancement changes before completing this phase."
    gate: test_gate
  optimize:
    intent: "Perform bounded cleanup after behavior is protected: run AI slop cleanup, remove duplication, remove unnecessary abstraction, and simplify or optimize internal algorithms without broad rewrites."
    owner_role: implementer_backend
    applicability: conditional_recommended_for_code_change
    skip_rule: "Code-change runs should run optimize when practical; skipping requires explicit reason in phase_plan and checklist.md."
    expected_outputs:
      - slop-cleanup-log.md
      - optimize-log.md
      - updated_diff_when_cleanup_is_applied
      - verification_after_cleanup
    rules:
      - "Treat AI slop cleanup as an explicit micro-stage before structural optimization when a backend/code actor is used."
      - "After slop cleanup, run the selected verification profile/gate command before proceeding to broader optimization when files changed."
      - "After duplication/abstraction/algorithm optimization, run the selected verification profile/gate command again before completing optimize."
    gate: regression_gate
  update_docs:
    intent: "Update durable project docs or record why no update is needed."
    owner_role: implementer_backend
    applicability: conditional
    expected_outputs:
      - docs-update.md
    rules:
      - "A no-docs-change decision is still an artifact, not an omitted phase."
      - "When a roadmap task is completed, update the roadmap status only after implementation, verification, KAH evidence, and required reviews support completion."
      - "Run the selected verification profile/gate command or the docs validation target after docs changes when docs participate in generated outputs, examples, or tested contracts."
    gate: docs_gate
  request_feedback:
    intent: "Request independent read-only feedback for every KHS run, with optional continuation rounds 2..5 when useful feedback risk remains."
    owner_role: feedback_backend
    applicability: required_round_1_conditional_rounds_2_to_5
    expected_outputs:
      - feedback-request.md
      - feedback-1.md
      - feedback-2.md_when_round_2_runs
      - feedback-3.md_when_round_3_runs
      - feedback-4.md_when_round_4_runs
      - feedback-5.md_when_round_5_runs
    gate: feedback_request_gate
  handle_feedback:
    intent: "Triage every requested feedback round, apply valid items, and reject invalid items with evidence."
    owner_role: implementer_backend_plus_hermes
    applicability: required_for_each_requested_feedback_round
    expected_outputs:
      - feedback-triage-1.md
      - handle-feedback-1.md
      - feedback-triage-2.md_when_round_2_runs
      - handle-feedback-2.md_when_round_2_runs
      - feedback-triage-3.md_when_round_3_runs
      - handle-feedback-3.md_when_round_3_runs
      - feedback-triage-4.md_when_round_4_runs
      - handle-feedback-4.md_when_round_4_runs
      - feedback-triage-5.md_when_round_5_runs
      - handle-feedback-5.md_when_round_5_runs
    rules:
      - "If feedback has no actionable items, record 'no actionable feedback'."
      - "When feedback changes code/docs, rerun affected verification."
    gate: feedback_handling_gate
  mar_review:
    intent: "Run role-first MAR on the current post-feedback review surface and produce merge-pack plus Blue disposition evidence before final completion."
    owner_role: mar_reviewers
    applicability: required_for_development_unless_recorded_user_waiver
    expected_outputs:
      - mar-review.md
      - mar-merge-pack.md
      - mar-blue-disposition.md
      - refreshed_mar_review_after_accepted_fix_when_needed
    rules:
      - "Required roles are logic, security, arch, cve, and test_adequacy unless reviewed task policy changes them."
      - "Provider availability, prompt rendering, dispatch success, model wording, or model voting is not review completion authority."
      - "PASS and PASS_WITH_FINDINGS are terminal candidates only after role coverage and Blue/Red disposition are complete."
      - "REQUEST_CHANGES, BLOCKED, DEGRADED, and FAILED are non-terminal unless 주군 explicitly records a waiver/stop decision with accepted residual risk."
      - "Accepted requested changes route to the selected implementer lane; affected verification and refreshed MAR evidence are required before second_color_review and final_verify."
    gate: mar_task_loop_gate
  second_color_review:
    intent: "Run focused post-MAR Red/Orange/Gray review after MAR disposition and any accepted fixes are verified."
    owner_role: color_reviewers
    applicability: required_for_development_unless_recorded_user_waiver
    expected_outputs:
      - second-color-review.md
      - post-mar-feedback-triage.md
    rules:
      - "Second color review checks MAR role coverage, Blue disposition, requested-change routing, post-fix verification, and refreshed MAR evidence when fixes changed the reviewed surface."
      - "If second color review requests changes, route them to the selected implementer lane, rerun affected verification, refresh MAR when the reviewed surface changed, and rerun focused second color review."
    gate: post_mar_color_review_gate
  final_verify:
    intent: "Hermes proves the run is complete from phase_plan, checklist.md, artifacts, KAH gates, KAB evidence, CodeGraph evidence, repo state, required reviews, reversible packet/run-summary indexes when present, and user-facing report readiness before commit."
    owner_role: hermes
    applicability: required
    expected_outputs:
      - verification.md
      - final-report.md
      - run-summary.yaml_when_present
      - phase-packets/<phase>.yaml_when_present
    rules:
      - "When compact summaries are present, verify packet_validity, artifact paths, checksums, retrieval instructions, invalidation behavior, and compression-forbidden direct references before relying on them."
      - "For development runs, verify MARTL evidence: role coverage, merge pack, Blue disposition, non-terminal status handling, requested-change routing, post-fix verification, refreshed MAR evidence when the surface changed, and second color review."
    gate: final_gate
  improve:
    intent: "Capture project-local improvement candidates and decide whether shared KHS promotion is warranted."
    owner_role: hermes
    applicability: conditional
    expected_outputs:
      - improvement-note.md
    gate: improvement_gate
