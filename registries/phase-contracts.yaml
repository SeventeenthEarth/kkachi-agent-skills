version: 0.2.0
purpose: "Canonical KHS phase contracts. KHS phase_plan is the workflow SOT; KAH metadata remains deterministic helper classification and must not decide which KHS phases execute."

workflow_authority:
  sot: phase_plan
  kah_metadata_role: helper_classification
  kah_metadata_fields:
    - work_path
    - work_mode
    - execution_mode
    - urgency
    - sot_policy
  rule: "KHS decides phase applicability; KAH records artifacts/gates/events deterministically."

canonical_spine:
  - plan
  - ask
  - implement
  - enhance_test
  - optimize
  - update_docs
  - request_feedback
  - handle_feedback
  - final_verify
  - improve

role_model:
  hermes:
    responsibility:
      - manager_orchestrator
      - risk_approval_router
      - final_verifier
      - user_facing_korean_reporter
    default_code_author: false
    simple_direct_exception: "Only outside KHS, or when the master explicitly converts the work to a direct Hermes task."
  planner_backend:
    phases:
      - plan
      - ask
  implementer_backend:
    phases:
      - implement
      - enhance_test
      - optimize
      - update_docs
      - handle_feedback
  feedback_backend:
    phases:
      - request_feedback
    write_permission: read_only_by_default
  mapping_rule: "Logical roles may share one physical KAB backend/session or use separate backends according to project policy, user preference, Hermes judgment, and capability gates."

task_basis:
  user_selects_task_each_run: true
  no_auto_next_task_default: true
  expected_docs_surfaces:
    - roadmap
    - architecture
    - adr
    - specs
    - implementation_notes
    - todo

task_classification_policy:
  activation_boundary: "Classification is inside KHS/Kkachi project-execution mode only; default Hermes/direct commander conversation remains outside KHS unless activation triggers are met."
  classification_required_before_phase_selection: true
  source: registries/task-taxonomy.yaml
  classes:
    - development
    - research_evidence
    - docs_only
    - simple_command_report
    - bootstrap_config
    - collaboration_review
  rules:
    - "Do not classify every chat turn; first decide whether KHS mode is active for this project/run."
    - "Do not apply the full development spine to read-only research, evidence collection, simple command/report, or pure docs tasks."
    - "Every skipped development phase must have an explicit reason in task-contract.yaml, phase-plan.yaml, checklist.md, and final report."
    - "Simple command/report tasks normally stay outside KHS unless the master explicitly keeps them inside a KHS/KAH run."
    - "Long-lived team-member collaboration uses Kanban evidence; temporary subagents do not count as team-member delegation."
    - "State investigation that only reports current facts maps to research_evidence; changing spec/SOT/roadmap/handoff from that evidence maps to docs_only + Path B unless it also changes executable behavior or execution policy."
    - "If a docs-only task changes architecture, process policy, contracts, roadmap status, or examples that tests validate, require docs validation and consider CodeGraph refresh."
  default_spines:
    development_full:
      phases: [codegraph_refresh, plan, ask, implement, enhance_test, optimize, update_docs, request_feedback, handle_feedback, final_verify, improve]
    research_evidence_light:
      phases: [task_contract, evidence_collection, source_citation, final_verify]
    docs_only_light:
      phases: [task_contract, plan, update_docs, docs_validation, final_verify]
    direct_report:
      phases: [command_evidence, final_report]
    bootstrap_config:
      phases: [task_contract, preflight, configure, verification, final_verify]
    review_light:
      phases: [task_contract, review_request, feedback_evidence, final_verify]

codegraph_policy:
  first_task_completion_command: "codegraph init -i"
  new_task_start_command: "codegraph index"
  required_when:
    - code_change_run
    - docs_or_skill_change_that_changes_process_or_architecture
    - task_uses_codegraph_mcp_context
  evidence_rules:
    - "At the start of every new KHS task after CodeGraph exists, run `codegraph index <repo>` and preserve `codegraph status <repo>` evidence before backend planning."
    - "If the repository has no `.codegraph/` and the previous completed task made CodeGraph initialization due, run `codegraph init -i <repo>` and preserve the resulting status evidence."
    - "If CodeGraph is unavailable, record the missing command as a blocker or explicit degraded-evidence reason; do not silently skip code context refresh."

kab_usage_policy:
  kab_adoption_stage: required_in_project_backend_policy_or_run_artifact
  backend_execution: required_when_backend_or_bridge_evidence_needed
  automated_review_by_different_tool: kab_later_until_transport_evidenced
  plan_lifecycle: required_when_kab_plan_surface_is_used
  bridge_evidence: required_when_runtime_completion_or_backend_identity_is_claimed
  khs_code_change: required_when_kab_backed_or_backend_executed
  khs_dev_run: required_when_kab_backed_execution_plan_lifecycle_or_bridge_evidence_is_part_of_contract
  stage1_direct_codex_app_server_baseline: allowed_when_explicitly_authorized_and_no_kab_codex_runtime_claimed
  khs_docs_only: not_required_unless_backend_execution_or_kab_review_transport_needed
  kas_kah_local_exception: "Allowed for scoped KAS/KAH-local CLIMVP, GRAPHMVP, and docs-only maintenance when explicitly authorized and recorded; must not claim KAB runtime support."
  kab_later_required_for:
    - backend_execution
    - automated_review_by_different_tool
    - kab_plan_lifecycle
    - bridge_evidence

feedback_loop_policy:
  minimum_rounds: 1
  maximum_rounds: 5
  round_1_required: true
  additional_rounds: "Hermes decides when optional request-feedback/handle-feedback continuation rounds 2..5 are useful; additional rounds are not mandatory."
  no_actionable_feedback: "Still run handle-feedback and record 'no actionable feedback'."

implementation_approval_policy:
  low_risk_default: auto_approve_after_plan_and_ask
  user_notice_required_before_auto_start: true
  explicit_user_approval_required_when:
    - api_change
    - db_or_schema_or_migration_change
    - security_auth_or_secret_handling_change
    - dependency_change
    - architecture_change
    - sot_change
    - large_diff_or_broad_file_fanout
    - low_confidence
    - unresolved_ask_phase_ambiguity

paths:
  A_development_execution:
    description: "Existing SOT, roadmap trace, and acceptance basis exists before implementation."
    code_write_default: allowed_through_approved_lane; KAB required only for KAB-backed or backend-executed writes
    required_before_write:
      - sot_basis
      - roadmap_trace_or_not_applicable_reason
      - acceptance_criteria
      - task_contract
      - phase_plan
      - plan_md_captured_from_kab_when_kab_planner_is_used
      - checklist_md_normalized_by_khs
      - backend_selection_when_kab_lane_is_used
      - capability_check_when_kab_lane_is_used
      - prompt_md_when_kab_lane_is_used
      - codegraph_index_or_unavailable_reason
      - plan_fixed_with_required_red_approval_when_project_policy_requires_it
      - ask_phase_completed
  B_discovery_shaping:
    description: "SOT, roadmap trace, acceptance criteria, or implementation handoff is missing or weak."
    code_write_default: forbidden
    output_goal: "Durable SOT/roadmap/acceptance/handoff artifacts that can enter Path A."
    required_outputs:
      - problem_framing
      - sot_update_or_minimal_sot
      - roadmap_trace
      - acceptance_criteria
      - non_goals
      - implementation_handoff

phase_plan_contract:
  artifact: phase-plan.yaml
  ownership: khs_hermes
  status_values:
    - pending
    - in_progress
    - done
    - skipped
    - blocked
    - not_applicable
  applicability_values:
    - required
    - conditional
    - optional
    - not_applicable
  rules:
    - "Every canonical phase in the selected task spine must have a phase_plan entry; development-only phases outside the selected spine may be omitted or marked not_applicable with reasons."
    - "KAH work_path/work_mode/execution_mode may inform initial defaults but must not override task_classification or phase_plan applicability."
    - "Skipped or not_applicable entries require a reason."
    - "request_feedback_1 and handle_feedback_1 are required for every KHS run."
    - "request_feedback_2..5 and handle_feedback_2..5 are conditional continuation rounds and must not exceed round 5."
    - "Code-change runs include optimize as conditional_recommended; skipping requires a reason."
    - "final_verify checks phase_plan and checklist.md before final report."

phases:
  plan:
    intent: "Define the path-appropriate plan before backend execution and create the mandatory run progress checklist."
    owner_role: planner_backend
    required_inputs:
      - task_contract
      - phase_plan
      - sot_basis
      - project_overlay
      - codegraph_status_or_degraded_reason_when_required
    expected_outputs:
      - plan.md
      - checklist.md
    kab_plan_capture_contract:
      when_kab_planner_lane_is_used: true
      source_commands:
        - "kkachi-agent-bridge plan read --session <session_id>"
        - "GET /api/plan/<session_id>"
      required_response_fields:
        - plan.plan_state
        - plan.plan_text
        - plan.plan_ref
        - plan.source_evidence
      prompt_requirements:
        - "Ask the planner backend to include a clearly delimited 'KHS Checklist Seed' section in plan.plan_text."
        - "The seed should use unchecked markdown tasks and include phase, evidence artifact, and verification/check condition."
        - "The seed is input for KHS normalization, not the final KAH checklist.md by itself."
      storage_rules:
        - "Copy plan.plan_text into plan.md before implementation starts."
        - "Preserve plan.plan_state, plan.plan_ref, and plan.source_evidence in plan.md and/or bridge-events.md."
        - "When project policy requires Red plan approval, keep implementation blocked until the Red verdict is ACCEPT or accepted feedback has been folded into a fixed plan."
      backend_timing:
        claude: "capture in plan_pending_approval before approve; approve starts implementation"
        glm: "capture in plan_pending_approval before approve; approve starts implementation"
        codex: "capture in plan_pending_approval before approve; approve starts implementation"
        gemini: "capture in plan_pending_approval or plan_approved_waiting_for_start; implementation starts only after start-approved"
        opencode: "capture in plan_pending_approval or plan_approved_waiting_for_start; fail closed on PLAN_AMBIGUOUS"
      safe_order:
        - plan_start
        - plan_read
        - save_plan_text_to_plan_md
        - derive_checklist_md_from_plan_and_phase_contract
        - approve_or_start_according_to_backend
    checklist_contract:
      owner: khs_hermes
      source_inputs:
        - plan.plan_text_from_kab
        - khs_checklist_seed_when_present
        - phase_contracts_yaml
        - task_contract
        - acceptance_criteria
        - expected_evidence_artifacts
      output_artifact: checklist.md
      note: "KAB may include task checkboxes inside plan.plan_text, especially for OpenCode, but KHS/Hermes owns the normalized KHS progress checklist stored in KAH."
      mandatory: true
      timing:
        create: "during plan, after plan.plan_text capture and before implementation approval/start"
        update: "after ask and after every later phase"
      required_rows:
        - every_canonical_phase
        - feedback_round_1
        - conditional_feedback_rounds_2_to_5
      required_fields:
        - phase
        - required_or_conditional
        - state
        - owner_role
        - backend_or_session
        - evidence_artifact
        - gate_or_check
        - notes_or_skip_reason
      state_values:
        - pending
        - in_progress
        - done
        - skipped
        - blocked
      rules:
        - "Skipped or not-applicable phases must keep a row with an explicit reason."
        - "Code-change runs include optimize by default; skipping optimize requires a reason."
        - "Code-change runs include CodeGraph refresh evidence, implementation `make test`, test-enhancement `make test`, slop-cleanup `make test`, and optimization `make test` rows unless explicitly not applicable."
        - "Feedback must run at least once and at most five times; rounds 2..5 are optional continuation rounds only."
        - "Final verification must use checklist.md to prove every required phase has evidence."
    gate: plan_gate
  ask:
    intent: "Always ask after plan whether ambiguity, missing decisions, or user choices remain before implementation."
    owner_role: planner_backend_plus_hermes
    applicability: required
    expected_outputs:
      - ask.md
      - answered-decisions.md
      - updated_plan_or_phase_plan_when_decisions_change
    rules:
      - "Ask the planner backend to surface ambiguity or decision needs."
      - "Hermes answers from SOT/project context when safe."
      - "Ask the master only when Hermes cannot decide safely or user intent must be confirmed."
      - "If no open questions remain, record that explicitly instead of skipping the phase."
    gate: decision_gate
  implement:
    intent: "Reach the approved desired state in Path A, or produce handoff artifacts only in Path B."
    owner_role: implementer_backend
    required_inputs:
      - phase_plan
      - plan.md
      - checklist.md
      - selected-cli.json
      - prompt.md
      - ask_phase_completion
    approval_before_start:
      low_risk: "Hermes may approve/start automatically after notifying the master with intended direction."
      high_risk: "Require explicit master approval."
    expected_outputs:
      - diff.patch
      - impl-log.md
      - cli-output.md
      - verification_after_implementation_make_test
    rules:
      - "After implementation changes, run the repository aggregate test command, normally `make test`, before marking implementation complete."
    gate: implementation_gate
  enhance_test:
    intent: "Add or improve unit, integration, and e2e regression coverage where risk warrants it, then re-run the aggregate verification command."
    owner_role: implementer_backend
    applicability: conditional
    skip_rule: "Allowed only when phase_plan and checklist.md record why no test enhancement is useful."
    expected_outputs:
      - test-plan.md
      - test-log.md
      - verification_after_test_enhancement_make_test
    rules:
      - "Assess unit, integration, and e2e coverage separately for the changed behavior."
      - "Integration tests should use mocks/fakes/stubs instead of production external resources."
      - "E2E tests must use isolated test environments and must not affect live Hermes, Discord, gateway, auth, or production user state."
      - "Run `make test` after test enhancement changes before completing this phase."
    gate: test_gate
  optimize:
    intent: "Perform bounded cleanup after behavior is protected: run AI slop cleanup, remove duplication, remove unnecessary abstraction, and simplify or optimize internal algorithms without broad rewrites."
    owner_role: implementer_backend
    applicability: conditional_recommended_for_code_change
    skip_rule: "Code-change runs should run optimize when practical; skipping requires explicit reason in phase_plan and checklist.md."
    expected_outputs:
      - slop-cleanup-log.md
      - optimize-log.md
      - updated_diff_when_cleanup_is_applied
      - verification_after_cleanup
    rules:
      - "Treat AI slop cleanup as an explicit micro-stage before structural optimization when a backend/code actor is used."
      - "After slop cleanup, run `make test` before proceeding to broader optimization when files changed."
      - "After duplication/abstraction/algorithm optimization, run `make test` again before completing optimize."
    gate: regression_gate
  update_docs:
    intent: "Update durable project docs or record why no update is needed."
    owner_role: implementer_backend
    applicability: conditional
    expected_outputs:
      - docs-update.md
    rules:
      - "A no-docs-change decision is still an artifact, not an omitted phase."
      - "When a roadmap task is completed, update the roadmap status only after implementation, verification, KAH evidence, and required reviews support completion."
      - "Run `make test` or the docs validation target after docs changes when docs participate in generated outputs, examples, or tested contracts."
    gate: docs_gate
  request_feedback:
    intent: "Request independent read-only feedback for every KHS run, with optional continuation rounds 2..5 when useful feedback risk remains."
    owner_role: feedback_backend
    applicability: required_round_1_conditional_rounds_2_to_5
    expected_outputs:
      - feedback-request.md
      - feedback-1.md
      - feedback-2.md_when_round_2_runs
      - feedback-3.md_when_round_3_runs
      - feedback-4.md_when_round_4_runs
      - feedback-5.md_when_round_5_runs
    gate: feedback_request_gate
  handle_feedback:
    intent: "Triage every requested feedback round, apply valid items, and reject invalid items with evidence."
    owner_role: implementer_backend_plus_hermes
    applicability: required_for_each_requested_feedback_round
    expected_outputs:
      - feedback-triage-1.md
      - handle-feedback-1.md
      - feedback-triage-2.md_when_round_2_runs
      - handle-feedback-2.md_when_round_2_runs
      - feedback-triage-3.md_when_round_3_runs
      - handle-feedback-3.md_when_round_3_runs
      - feedback-triage-4.md_when_round_4_runs
      - handle-feedback-4.md_when_round_4_runs
      - feedback-triage-5.md_when_round_5_runs
      - handle-feedback-5.md_when_round_5_runs
    rules:
      - "If feedback has no actionable items, record 'no actionable feedback'."
      - "When feedback changes code/docs, rerun affected verification."
    gate: feedback_handling_gate
  final_verify:
    intent: "Hermes proves the run is complete from phase_plan, checklist.md, artifacts, KAH gates, KAB evidence, CodeGraph evidence, repo state, required reviews, and user-facing report readiness before commit."
    owner_role: hermes
    applicability: required
    expected_outputs:
      - verification.md
      - final-report.md
    gate: final_gate
  improve:
    intent: "Capture project-local improvement candidates and decide whether shared KHS promotion is warranted."
    owner_role: hermes
    applicability: conditional
    expected_outputs:
      - improvement-note.md
    gate: improvement_gate
